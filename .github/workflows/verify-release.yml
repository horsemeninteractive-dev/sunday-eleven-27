# Verifying a release tag, on a machine that is not this one.
#
# `tools/release.ts` cuts a release and deploys the website, and everything it
# does is verifiable from the machine that runs it. The two *packaged* targets are
# not: the Android bundle is built by Gradle with a keystore that lives outside
# the repository, and the desktop application is only proven to work by opening
# it and playing a career in it — which `npm run desktop:smoke` does, on Windows,
# with a real window. Both of those were run by hand for 0.10.2 and neither was
# run by anything automatic, which means the next release tag would ship them
# unverified unless somebody remembered.
#
# So this runs on a tag, and it is two jobs because the two targets need
# different machines:
#
#   - **the Android bundle** on Linux, because Gradle, the SDK and the JDK are
#     all cross-platform and a Linux runner is the cheapest place to put them.
#     The keystore is never in the repository — `android/keystore.properties` is
#     ignored, and `npm run android:preflight` fails if signing material has ever
#     been tracked — so the key arrives as repository secrets, is written to the
#     runner's temporary directory, and is referenced from a properties file
#     generated for this build alone.
#
#   - **the desktop application** on Windows, because it is a Windows
#     application: electron-builder packs an NSIS installer around a Windows
#     Electron distribution, and `tools/desktopSmoke.mjs` drives the result
#     through Chromium's DevTools protocol — a window that loads, a career that is
#     played, a file that is exported and read back, a close that waits for the
#     last save. None of that can be faked on a machine that cannot open a window.
#
# What a tag has to be. The version in `package.json` is the release's version,
# and the tag is checked against it rather than trusted: a `v0.11.0` tag on a tree
# that says `0.10.2` fails here, which is the one mistake that produces artifacts
# that look right and are not.
#
# What this cannot verify, stated rather than implied:
#
#   - **iOS.** There is no `ios/` project and Xcode only runs on macOS. This
#     workflow does not pretend otherwise; see `IOS.md`.
#   - **that Play accepts the upload key.** Signing is proven from the artifact
#     (the certificate is printed below); *acceptance* is proven by uploading it,
#     which is a store account and a person's decision, not a build step.
#   - **the installer itself.** `npm run desktop:smoke` tests the unpacked
#     application that was just packed, not the NSIS installer, which is not run
#     anywhere in CI — an installer change is caught by the builder failing or by
#     installing it, and by nothing in between.
#   - **the website.** `npm run release` deploys it, and a deploy that succeeded
#     is not a page that renders.
#
# Secrets it needs, all set on the repository (Settings → Secrets and variables →
# Actions). Without them the Android job fails in its first step, on purpose and
# with a message that says so, rather than at the end of a Gradle build:
#
#   ANDROID_KEYSTORE_BASE64     the upload keystore, base64-encoded:
#                                 base64 -w0 upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD   the store password
#   ANDROID_KEY_ALIAS           the key's alias (this repository uses `upload`)
#   ANDROID_KEY_PASSWORD        the key's password
#
# The desktop job needs no secrets at all: nothing in `electron-builder.yml`
# reads one, and an installer that is not code-signed is still an installer.
#
# A note on the runner that is most likely to need adjusting. GitHub's Windows
# runners are virtual machines with no GPU, and the smoke test paints a window and
# measures its frame rate, so that job is the one to read first if this comes back
# red — an honest failure of the runner rather than of the game, and the report it
# uploads says which check failed and why.

name: Verify a release tag

on:
  push:
    tags:
      # Every release this repository cuts is tagged `v0.10.2` and so on.
      - 'v*'
  # So a run can be started by hand, which is how to test this workflow without
  # cutting a release — note that the tag check below then compares against the
  # branch's own version rather than a tag.
  workflow_dispatch:

# Read-only: this workflow builds and reports. It does not publish anything, which
# is why it needs no write access to the repository — and why deploying stays
# where it is, in `npm run release`, run by a person.
permissions:
  contents: read

jobs:
  android:
    name: The signed Android bundle
    runs-on: ubuntu-latest
    # Gradle's first run downloads the wrapper and the Android Gradle Plugin, so
    # this is minutes rather than seconds — but a build that has stopped making
    # progress should fail here rather than spend the runner's six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: JDK 21, which is what the Android module compiles against
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          # Gradle's own dependency cache, so a second run does not re-download
          # the AGP and its transitive jars from `maven.google.com`.
          cache: gradle

      # The runner image ships the SDK and `sdkmanager` but not necessarily the
      # three packages this build needs, and the preflight refuses to build
      # against a `build-tools` directory that is a husk (a failed download
      # leaves one) or without platform-tools. The names and revisions are the
      # ones `android/variables.gradle` states and `npm run android:preflight`
      # checks: compileSdk/targetSdk 36 and build-tools 36.0.0.
      #
      # `yes` answers the licence prompt for the packages the image has not
      # accepted yet; it is the same command `ANDROID.md` gives. It writes into
      # the SDK the image already ships, which the runner user owns — if a future
      # image makes that read-only, this step and only this step is the one to
      # give elevated rights to, and `npm run android:preflight` below names the
      # packages it could not find rather than failing inside Gradle.
      - name: The SDK packages the build compiles against
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: The upload key is configured
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on this repository, so a signed bundle cannot be built. See the secrets listed at the top of this workflow, or run the job where the key is (a release is cut by a person, on a machine that has it)."
            exit 1
          fi

      # The keystore goes to the runner's temporary directory, not into the
      # checkout, and the properties file that names it is the file git already
      # ignores. Forward slashes, because Gradle reads this with
      # `java.util.Properties`, where a backslash is an escape.
      - name: Write the upload key where Gradle can read it
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/signing/upload-keystore.jks"
          {
            echo "storeFile=$RUNNER_TEMP/signing/upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties
          ls -l "$RUNNER_TEMP/signing/upload-keystore.jks"

      - run: npm ci

      # In this order, and the order is the point: `build:native` leaves the
      # browser-only files out of the bundle, and `cap sync` copies *that* bundle
      # into the Android project. A bundle built from a stale `dist/` builds,
      # signs and uploads last week's game, which is the failure
      # `npm run android:preflight` exists to catch.
      - name: The packaged bundle, with no service worker in it
        run: npm run build:native

      - name: Put that bundle in the Android project
        run: npx cap sync android

      - name: Build the signed bundle (preflight, then Gradle)
        run: npm run android:bundle

      # Two claims about the artifact, checked on the artifact: that it is signed,
      # and that the game inside it is the version this tag says it is. The second
      # is the one a Gradle build cannot make — signing a bundle says nothing
      # about which build was in `dist/` when it ran.
      - name: The bundle is signed, and carries this tag's version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB"
          python3 - "$AAB" <<'PY'
          import json, os, re, sys, zipfile

          aab = sys.argv[1]
          version = json.load(open('package.json', encoding='utf-8'))['version']
          ref_type, ref_name = os.environ.get('REF_TYPE', ''), os.environ.get('REF_NAME', '')
          print(f'package.json says {version}; ref is {ref_type} {ref_name}')

          if ref_type == 'tag':
              tag = ref_name.lstrip('v')
              if tag != version:
                  sys.exit(f'the tag says {tag} and package.json says {version} — one of the two is wrong')

          z = zipfile.ZipFile(aab)
          chunks = [n for n in z.namelist() if n.startswith('base/assets/public/assets/') and n.endswith('.js')]
          if not chunks:
              sys.exit('the bundle holds no game at all: no bundled chunks under base/assets/public/assets')
          baked = [n for n in chunks if version in z.read(n).decode('utf-8', 'replace')]
          print(f'{len(chunks)} bundled chunks, {len(baked)} carrying {version}')
          if not baked:
              sys.exit(f'none of the {len(chunks)} bundled chunks carries {version}: this bundle is not the tagged build')
          PY

      - name: Keep the bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  desktop:
    name: The Windows installer, and the smoke test
    runs-on: windows-latest
    # Packing is a few minutes and the smoke test plays a career; a run that has
    # wedged — a window that never appears, an Electron process that will not
    # exit — should end here with the report rather than hang for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Compiles the shell, builds the renderer and packs the NSIS installer
      # exactly as `npm run desktop:pack` does on a developer's machine, into
      # `desktop-release/`, which is ignored by git and apart from `dist/`.
      - name: Pack the installer
        run: npm run desktop:pack

      - name: The tag's version is the one that was packed
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          ls -l desktop-release/*.exe
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = "tag" ] && [ "${REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag says ${REF_NAME#v} and package.json says $version"
            exit 1
          fi
          if [ ! -f "desktop-release/Sunday-Eleven-27-Setup-$version.exe" ]; then
            echo "::error::no installer for $version — the packer named it something else"
            exit 1
          fi

      # The application that was just packed, opened and driven: a world
      # generated, a career played and exported, the career read back through the
      # game's own import screen, the window closed so the last save lands, and
      # the career found again after a restart. It exits non-zero for any check
      # that failed, and prints its report as JSON — kept as an artifact because
      # the report is the evidence, not the green tick.
      - name: Drive the packaged application
        shell: bash
        # `pipefail`, because without it `tee` is the last command in the pipe and
        # the step's status is tee's: a smoke test that failed would report a
        # green step whose log happens to say otherwise.
        run: |
          set -o pipefail
          npm run desktop:smoke | tee desktop-smoke-report.log

      - name: Keep the report and the installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ github.ref_name }}
          path: |
            desktop-smoke-report.log
            desktop-release/Sunday-Eleven-27-Setup-*.exe
          if-no-files-found: warn
