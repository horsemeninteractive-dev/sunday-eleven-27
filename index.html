<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes the game's own safe-area handling
         possible at all: without it the browser and the native shells report
         `env(safe-area-inset-*)` as zero and quietly lay the page inside the
         system bars. Capacitor's Android side reads this same attribute to
         decide whether to hand the insets to CSS or to pad the WebView itself,
         so it is a contract with the shell as much as a hint to a browser. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sunday Eleven 27 — Sunday League Football Management</title>
    <meta name="description" content="A grassroots English Sunday League football management simulation." />
    <meta name="theme-color" content="#08090b" />

    <!-- What the game looks like when somebody pastes its link.
         Discord, Slack, iMessage and every search result read this and never
         run the game, so this block is the first impression of Sunday Eleven
         that most people will ever get. `og:image` is absolute because the
         unfurling bot fetches it from a server, not from this page, and it is
         the whole difference between a card with the game on it and a grey box
         with a sentence in it. The card is built by `npm run og`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sunday Eleven 27" />
    <meta property="og:url" content="https://sundayeleven.pages.dev/" />
    <meta property="og:title" content="Sunday Eleven 27 — Sunday League Football Management" />
    <meta
      property="og:description"
      content="Pick a side of a muddy pitch, pick a team from the local game, and take them to the whistle."
    />
    <meta property="og:image" content="https://sundayeleven.pages.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A mown, rain-darkened Sunday League pitch with the words Sunday Eleven 27."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sunday Eleven 27 — Sunday League Football Management" />
    <meta
      name="twitter:description"
      content="Pick a side of a muddy pitch, pick a team from the local game, and take them to the whistle."
    />
    <meta name="twitter:image" content="https://sundayeleven.pages.dev/og.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The face, fetched while the bundle is still arriving.
         The @font-face rules live in `styles.css`, which is inside the bundle,
         so without this the first paint has no face to use and the game would
         open in the platform's own — the one visible flash this avoids. The
         roman Latin file is the one every screen needs; the other three are
         asked for by the stylesheet only when text in them appears. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-standard-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The season, for the same reason and one of its own: the 27 is the very
         first thing drawn on the first screen, and it is the one piece of type
         in the game set in a second face — so a swap here would be a numeral
         changing shape under the manager's eyes a moment after it appeared.
         Twelve kilobytes, and it is only ever fetched when a 2 or a 7 is set. -->
    <link rel="preload" href="/fonts/Fake%20Identity.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Launched from a home screen this opens as an app: no browser chrome,
         no address bar, and the title it is given is the short one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sunday Eleven" />

    <!-- The opening placeholder's own styles.
         The stylesheet arrives with the bundle, so the placeholder is painted
         before it does. Everything it needs is therefore here, in literals:
         without this it flashes as unstyled black-on-white text on the first
         paint, then jumps to the styled version once the bundle catches up. The
         matching rules live in `styles.css` (see `.booting`); these are what
         make the very first frame look like the rest of the game. -->
    <style>
      html,
      body {
        margin: 0;
        background: #08090b;
      }
      #booting {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #08090b;
        font-family: 'Archivo', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
      }
      #booting .booting__label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7c868f;
      }
      #booting .booting__note {
        font-size: 11px;
        color: #5b646c;
      }
      /* The lights, for the same reason and by the same attribute the
         stylesheet uses: `data-theme` is set on the document element by the
         script below, and both palettes are stated here in literals because
         the stylesheet is still on its way. The same colours are in
         `styles.css` — a test in `src/ui/theme.test.ts` keeps the two honest —
         and this block is what stops a light-mode manager watching a near-black
         page turn over once the bundle lands. */
      html[data-theme='light'],
      html[data-theme='light'] body,
      html[data-theme='light'] #booting {
        background: #e2e5e9;
      }
      html[data-theme='light'] #booting .booting__label {
        color: #5c6673;
      }
      html[data-theme='light'] #booting .booting__note {
        color: #6d7681;
      }
    </style>

    <!-- Which way the lights are on, decided before the first paint.

         The preference lives in the browser, the stylesheet that reads it does
         not arrive until the bundle does, and the placeholder above has to be
         painted *before* then — so the one thing this page can do for itself is
         read the answer and write it on the document element. It is the same
         attribute `applyTheme` writes later, and the same shape of answer: the
         resolved theme, never `system`, so nothing downstream has a second
         decision to make. A browser with no storage, or with a preference that
         is nothing but rubbish in it, opens dark, which is what this game looks
         like. -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var raw = window.localStorage.getItem('slfm26.preferences');
          var chosen = raw ? JSON.parse(raw).theme : 'dark';
          var systemLight =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = chosen === 'light' || (chosen === 'system' && systemLight) ? 'light' : 'dark';
        } catch (error) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <!-- Shown until the game has opened its storage and decided what to open.
         It carries its own styles because the stylesheet arrives with the
         bundle, and the whole point of this is to be on screen *before* that. -->
    <div id="booting" class="booting">
      <span class="booting__label">Sunday Eleven 27</span>
      <span class="booting__note">Opening Sunday Eleven…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
