<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunday Eleven 27 — Sunday League Football Management</title>
    <meta name="description" content="A grassroots English Sunday League football management simulation." />
    <meta name="theme-color" content="#08090b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Launched from a home screen this opens as an app: no browser chrome,
         no address bar, and the title it is given is the short one. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sunday Eleven" />
  </head>
  <body>
    <!-- Shown until the game has opened its storage and decided what to open.
         It carries its own styles because the stylesheet arrives with the
         bundle, and the whole point of this is to be on screen *before* that. -->
    <div id="booting" class="booting">
      <span class="booting__label">Sunday Eleven 27</span>
      <span class="booting__note">Opening your career…</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
